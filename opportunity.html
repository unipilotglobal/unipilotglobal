<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opportunity details | UNIPILOT GLOBAL</title><meta name="description" content="Eligibility, deadline, documents, free video guide, expert tips and help for this scholarship or internship."><meta property="og:title" content="Opportunity details | UNIPILOT GLOBAL"><meta property="og:description" content="Eligibility, deadline, documents, free video guide, expert tips and help for this scholarship or internship."><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/favicon.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css"></head><body><div id="hdr"></div><main>
<div class="w sec" id="root" style="padding-top:40px"></div>
</main><div id="ftr"></div><noscript><p class="w">Please enable JavaScript to use this site.</p></noscript>
<script src="config.js"></script><script src="data/base.js"></script><script src="assets/site.js"></script>
<script>
UP.boot('find', U => {
  const { C, $, esc, D, LV, RCOL } = U, id = new URLSearchParams(location.search).get('id'), o = D.opps.find(x => x.id === id), root = $('#root');
  if (!o) { root.innerHTML = '<h1>Opportunity not found</h1><p class="mute">This link may be out of date.</p><a class="btn" href="scholarships.html">Browse all</a>'; return; }
  document.title = o.name + ' | ' + C.brand;
  const price = o.price || C.guidelinePrice, pay = o.pay || C.payLink, w = U.wa('Hello, I am interested in the guideline for: ' + o.name), w2 = U.wa('Please make a video guide for: ' + o.name), vid = o.video || U.ytId(C.defaultVideo);
  const where = o.countries.length ? o.countries.join(', ') : 'Multiple countries', sub1 = o.subjects.find(s => s !== 'All fields') || '', subj = o.subjects.length === 1 && o.subjects[0] === 'All fields' ? 'No field restriction listed' : o.subjects.filter(x => x !== 'All fields').join(', ');
  const link = o.link || 'https://www.google.com/search?q=' + encodeURIComponent(o.name + ' official application'), rel = D.opps.filter(x => x.id !== o.id && x.region === o.region && x.type === o.type).slice(0, 3);
  const tips = o.tips.map(x => [x, 1]).concat(U.tipsFor(o).map(x => [x, 0])).slice(0, 8), vq = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(o.name + ' how to apply');
  const video = vid ? U.video(vid, 'How to apply: ' + o.name) + `<p class="nav-note" style="margin:10px 0 0">${o.video ? 'Free video guide for this opportunity.' : 'Our free general guide to scholarship applications.'}</p>`
    : `<div class="vph"><h3>Video guide coming soon</h3><p>We are preparing a step-by-step video for this ${o.type.toLowerCase()}. Meanwhile, find application tutorials on YouTube or ask us to make this one next.</p><div class="acts"><a class="btn" href="${vq}" target="_blank" rel="noopener">Search YouTube guides</a>${C.youtubeChannel ? `<a class="btn out" href="${esc(C.youtubeChannel)}" target="_blank" rel="noopener">Our channel</a>` : ''}${w2 ? `<a class="btn out" href="${w2}" target="_blank" rel="noopener">Request this video</a>` : ''}</div></div>`;
  root.innerHTML = `<p><a href="scholarships.html">&larr; Back to finder</a></p><div class="det"><div>
  <div class="panel" style="border-top:5px solid ${RCOL[o.region] || '#1F4E8C'}"><span class="pill ${o.type}">${o.type}</span><span class="pill">${esc(o.levels.map(l => LV[l] || l).join(' / '))}</span><span class="pill">${esc(o.region)}</span>${o.funding === 'full' ? '<span class="pill ok">Fully funded</span>' : o.funding === 'stipend' ? '<span class="pill gold">Stipend or fellowship</span>' : ''}${o.closed ? '<span class="pill bad">Closed</span>' : ''}
   <h1 style="font-size:clamp(1.9rem,3.6vw,2.7rem);margin-top:10px">${esc(o.name)}</h1><p class="mute">${esc(o.sponsor)}</p>
   <div class="facts"><div><small>What it covers</small>${esc(o.award)}</div><div><small>Deadline</small>${esc(o.deadline)}</div><div><small>Host country</small>${esc(where)}</div><div><small>Subjects</small>${esc(subj)}</div><div><small>Application effort</small>${esc(o.effort || 'See official page')}</div>${o.best ? `<div><small>Best suited to</small>${esc(o.best)}</div>` : ''}</div>
   <p class="nav-note" style="margin:14px 0 0">${o.verified ? 'Details checked on ' + esc(U.fmtDate(o.verified)) + '. ' : ''}Dates and amounts change every year. Always confirm on the official page.</p></div>
  <div class="panel"><h2>Who can apply</h2><p style="margin:0">${esc(o.elig)}</p></div>
  <div class="panel"><h2>Watch: how to apply</h2>${video}</div>
  ${o.desc ? `<div class="panel"><h2>About this opportunity</h2><p style="margin:0">${esc(o.desc)}</p></div>` : ''}
  ${o.docs.length ? `<div class="panel chk"><h2>Documents to prepare</h2><div class="prog" id="chkp"></div>${o.docs.map(d => `<label><input type="checkbox">${esc(d)}</label>`).join('')}</div>` : `<div class="panel"><h2>Documents to prepare</h2><p style="margin:0">Requirements differ by year and university. Our guideline gives you a full checklist for this opportunity.</p></div>`}
  ${o.scoring ? `<div class="panel"><h2>How applicants are selected</h2><p style="margin:0">${esc(o.scoring)}</p></div>` : ''}${o.past ? `<div class="panel"><h2>Profile of past winners</h2><p style="margin:0">${esc(o.past)}</p></div>` : ''}
  ${(() => { const m = U.matFor(o).slice(0, 6); return `<div class="panel"><h2>Free materials</h2>${m.length ? `<div class="mgrid">${m.map(U.matCard).join('')}</div>` : '<p style="margin:0 0 6px">Templates, checklists and guides to help you apply.</p>'}<p style="margin:14px 0 0"><a href="materials.html"><b>Browse all free materials &rarr;</b></a></p></div>`; })()}
  <div class="panel"><h2>Tips from our advisors</h2><ol class="tips">${tips.map(t => `<li class="${t[1] ? 'x' : ''}">${esc(t[0])}</li>`).join('')}</ol></div>
  <p><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${o.link ? 'Go to the official application page' : 'Find the official page'}</a></p>
  ${rel.length ? `<h2 style="margin-top:44px">More in ${esc(o.region)}</h2><div class="grid">${rel.map(U.card).join('')}</div>` : ''}</div>
  <aside class="side"><div class="box" style="border:2px solid var(--gold);margin-bottom:16px"><h3>Ask an experienced advisor about this ${o.type.toLowerCase()}</h3><p class="mute">Not sure you qualify, or how to start? Send your question. We reply by email or WhatsApp.</p><button class="btn blk" id="askb" type="button">Contact an expert</button></div><div class="box dark"><span class="eyebrow">Winning guideline</span><h3>Step-by-step guideline for this ${o.type.toLowerCase()}</h3><ul class="ul" style="font-size:.93rem">${C.guidelineIncludes.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
   <a class="btn blk" href="consultation.html?service=guideline&s=${encodeURIComponent(o.id)}">Get this guideline</a><details class="pr"><summary>See price</summary><p>${price ? 'Price: <b>' + esc(price) + '</b>' : 'Send us your details and we will confirm the current price.'}</p>${pay && price ? `<a class="btn out blk sm" style="margin-top:8px" href="${esc(pay)}" target="_blank" rel="noopener">Pay online</a>` : ''}</details>${w ? `<a class="btn wa blk" style="margin-top:12px" href="${w}" target="_blank" rel="noopener">Ask on WhatsApp</a>` : ''}</div>
   <div class="box" style="margin-top:16px"><h3>Talk to a field expert</h3><p class="mute">${sub1 ? 'Speak with an advisor experienced in ' + esc(sub1) + ' to explore this and similar opportunities.' : 'Speak with an advisor experienced in your field to explore this and similar opportunities.'}</p><a class="btn blk" href="consultation.html?service=expert&subject=${encodeURIComponent(sub1)}&s=${encodeURIComponent(o.id)}">Book a field expert</a></div>
   ${(() => { const s = D.seminars.find(x => x.up); return s ? `<div class="box" style="margin-top:16px"><h3>Free seminar: ${esc(s.title)}</h3><p class="mute">${esc(U.fmtDate(s.date))}${s.time ? ', ' + esc(s.time) : ''}</p><a class="btn out blk" href="${esc(s.register || 'seminars.html')}" target="_blank" rel="noopener">Join free</a></div>` : ''; })()}
   <div class="box" style="margin-top:16px"><h3>After you win: visa and travel</h3><p class="mute">See the visa process step by step and what to prepare before you fly.</p><a class="btn out blk" href="visa.html${o.countries[0] ? '?country=' + encodeURIComponent(o.countries[0]) : ''}">Visa guide</a></div><div class="box" style="margin-top:16px"><h3>Get your SOP and CV reviewed</h3><p class="mute">Applications are won on the details. Our advisors review your documents against this opportunity.</p><a class="btn out blk" href="consultation.html?service=sop&s=${encodeURIComponent(o.id)}">Request a review</a></div></aside></div>`;
  $('#askb').onclick = () => U.ask(o);
  const ck = Array.from(document.querySelectorAll('.chk input')), K = 'up_chk_' + o.id; let st = []; try { st = JSON.parse(localStorage.getItem(K) || '[]'); } catch (e) { }
  const bar = () => { const n = ck.filter(c => c.checked).length, p = $('#chkp'); if (p) p.innerHTML = n + ' of ' + ck.length + ' ready<span class="pt"><i style="width:' + Math.round(100 * n / (ck.length || 1)) + '%"></i></span>'; };
  ck.forEach((c, i) => { c.checked = st.includes(i); c.onchange = () => { try { localStorage.setItem(K, JSON.stringify(ck.map((x, j) => x.checked ? j : -1).filter(j => j >= 0))); } catch (e) { } bar(); }; }); bar();
});
</script></body></html>
